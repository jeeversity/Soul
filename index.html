<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OnlyForYou</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 35%, #242424 0%, #0d0d0d 35%, #000 75%);
      color: white;
      overflow: hidden;
    }

    /* Stars */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      opacity: 0.6;
      animation: twinkle 3s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }

    /* Main */
    .container {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      z-index: 2;
    }

    .card {
      width: min(430px, 100%);
      text-align: center;
      padding: 45px 30px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 25px;
      background: rgba(255,255,255,0.045);
      backdrop-filter: blur(15px);
      box-shadow: 0 0 50px rgba(255,255,255,0.05);
      animation: appear 1.2s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .lock {
      font-size: 42px;
      margin-bottom: 18px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    .small-title {
      font-size: 11px;
      letter-spacing: 5px;
      color: #aaa;
      margin-bottom: 16px;
    }

    h1 {
      font-size: clamp(40px, 11vw, 62px);
      font-weight: 300;
      letter-spacing: -2px;
      margin-bottom: 12px;
    }

    h1 span {
      background: linear-gradient(90deg, #fff, #aaa, #fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: #999;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .password-box {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      outline: none;
      background: rgba(0,0,0,0.4);
      color: white;
      text-align: center;
      font-size: 14px;
    }

    input::placeholder {
      color: #666;
    }

    button {
      border: none;
      cursor: pointer;
      transition: 0.3s;
    }

    .unlock {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      background: white;
      color: black;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .unlock:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(255,255,255,0.12);
    }

    #message {
      min-height: 20px;
      margin-top: 15px;
      color: #888;
      font-size: 12px;
    }

    /* Welcome screen */
    #welcome {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #000;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 25px;
    }

    .welcome-content {
      max-width: 650px;
      animation: welcome 1.5s ease;
    }

    @keyframes welcome {
      from {
        opacity: 0;
        transform: scale(0.92);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .welcome-small {
      color: #777;
      font-size: 11px;
      letter-spacing: 6px;
      margin-bottom: 20px;
    }

    .welcome-title {
      font-size: clamp(48px, 13vw, 90px);
      font-weight: 200;
      letter-spacing: -4px;
      margin-bottom: 20px;
    }

    .welcome-text {
      color: #999;
      font-size: 15px;
      line-height: 1.8;
      margin-bottom: 35px;
    }

    .enter-btn {
      padding: 15px 35px;
      border-radius: 50px;
      background: white;
      color: black;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .enter-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 35px rgba(255,255,255,0.15);
    }

    /* Mobile */
    @media (max-width: 500px) {
      .card {
        padding: 38px 22px;
      }

      .password-box {
        display: block;
      }

      input {
        margin-bottom: 10px;
      }
    }
  </style>
</head>

<body>

  <!-- Stars -->
  <div class="stars">
    <div class="star" style="top:12%;left:18%;animation-delay:.3s"></div>
    <div class="star" style="top:24%;left:80%;animation-delay:1s"></div>
    <div class="star" style="top:70%;left:12%;animation-delay:1.5s"></div>
    <div class="star" style="top:82%;left:85%;animation-delay:.7s"></div>
    <div class="star" style="top:40%;left:92%;animation-delay:2s"></div>
    <div class="star" style="top:15%;left:55%;animation-delay:1.2s"></div>
    <div class="star" style="top:88%;left:45%;animation-delay:.4s"></div>
    <div class="star" style="top:55%;left:5%;animation-delay:2.2s"></div>
  </div>

  <!-- Password Screen -->
  <main class="container" id="loginScreen">

    <div class="card">

      <div class="lock">🔐</div>

      <div class="small-title">
        PRIVATE SPACE
      </div>

      <h1>
        <span>OnlyForYou</span>
      </h1>

      <p class="subtitle">
        Some things are not meant for everyone.<br>
        This little place is just for you.
      </p>

      <div class="password-box">
        <input
          type="password"
          id="password"
          placeholder="Enter the secret password"
          autocomplete="off"
        >
      </div>

      <button class="unlock" onclick="unlock()">
        UNLOCK ✨
      </button>

      <p id="message"></p>

    </div>

  </main>


  <!-- Welcome Screen -->
  <section id="welcome">

    <div class="welcome-content">

      <div class="welcome-small">
        ACCESS GRANTED
      </div>

      <h2 class="welcome-title">
        OnlyForYou
      </h2>

      <p class="welcome-text">
        Welcome to a little corner of the internet<br>
        that was made especially for you.
      </p>

      <button class="enter-btn" onclick="enterWebsite()">
        ENTER →
      </button>

    </div>

  </section>


  <script>

    // CHANGE PASSWORD HERE
    const SECRET_PASSWORD = "onlyforyou";

    function unlock() {

      const input = document.getElementById("password");
      const message = document.getElementById("message");

      if (input.value === SECRET_PASSWORD) {

        message.innerText = "Access granted ✨";

        setTimeout(() => {

          document.getElementById("loginScreen").style.display = "none";
          document.getElementById("welcome").style.display = "flex";

        }, 600);

      } else {

        message.innerText = "Hmm... that's not the secret 👀";

        input.value = "";

      }
    }

    function enterWebsite() {

      alert("Next chapter coming soon ✨");

    }

    // Press Enter to unlock
    document.getElementById("password").addEventListener("keydown", function(event) {

      if (event.key === "Enter") {
        unlock();
      }

    });

  </script>

</body>
</html>
